version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only. A limit of 0 keeps routine version updates off,
    # as they are today, while Dependabot security updates continue.
    open-pull-requests-limit: 0
    ignore:
      # vitest 5 needs @types/node 22 or newer; this repo pins ^20, so
      # `npm install` fails with ERESOLVE on Vercel (PR #32, reverted in #34).
      # Allow 4.x (4.1.11 fixes alerts 61/62). Revisit when @types/node moves to 22+.
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0"]
